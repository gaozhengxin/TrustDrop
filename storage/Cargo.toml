[package]
name = "storage"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
bytes = "1"
dotenv = "0.15"
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "1"
anyhow = "1.0.100"
futures = "0.3"
tokio-util = { version = "0.7", features = ["io-util"] }

drop-lib = { path = "../drop-lib" }
unsigned-varint = "0.8.0"
