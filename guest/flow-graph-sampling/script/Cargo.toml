[package]
name = "flow-graph-sampling-script"
version = "0.1.0"
edition = "2021"
autobins = false

[[bin]]
name = "flow-graph-sampling-client"
path = "src/main.rs"

[features]
execute = []
network = []

[dependencies]
alloy-sol-types = { workspace = true }
bincode = "1.3"
drop-lib = { path = "../../../drop-lib" }
flow-graph-sampling-guest-lib = { path = "../lib" }
hex = "0.4.3"
serde_json = "1"
sp1-sdk = { version = "=6.2.4", features = ["network"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
trustdrop-flow-graph-sampling = { path = "../../../extensions/dataset-sampling/flow-graph/lib" }
walrus_core = { path = "../../../walrus-core" }

[build-dependencies]
sp1-build = "=6.2.4"
