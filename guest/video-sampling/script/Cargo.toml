[package]
name = "video-sampling-script"
version = "0.1.0"
edition = "2021"
autobins = false
default-run = "video-sampling-client"

[[bin]]
name = "video-sampling-client"
path = "src/main.rs"

[features]
execute = []
network = []
chain-verify = []
publish = []

[dependencies]
alloy-sol-types = { workspace = true }
cid = "0.11.3"
hex = "0.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
sp1-sdk = { version = "=6.2.4", features = ["network"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
video-sampling-lib = { path = "../lib" }
drop-lib = { path = "../../../drop-lib" }
walrus_core = { path = "../../../walrus-core" }
sampling-challenge-client = { path = "../../../extensions/sampling-challenge-client" }

[build-dependencies]
sp1-build = "=6.2.4"
