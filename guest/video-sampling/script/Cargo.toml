[package]
name = "video-sampling-script"
version = "0.1.0"
edition = "2021"

[features]
execute = []
network = []

[dependencies]
alloy-sol-types = { workspace = true }
hex = "0.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
sp1-sdk = { version = "=6.2.4", features = ["network"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
video-sampling-lib = { path = "../lib" }
drop-lib = { path = "../../../drop-lib" }
walrus_core = { path = "../../../walrus-core" }

[build-dependencies]
sp1-build = "=6.2.4"
