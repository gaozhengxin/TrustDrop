[package]
name = "drop-lib"
version = "0.1.0"
edition = "2024"

[features]
# host 默认使用 std
default = []

# std 环境（GUI, TUI, 控制层, host）
std = []

# guest 用纯 no_std
guest = ["k256/arithmetic"]

[dependencies]
alloy-sol-types = { workspace = true }
blake3 = { version = "1.8.2", default-features = false }
sp1-lib = { version = "6.0.2", default-features = false }
sp1-zkvm = { version = "6.0.2" }
k256 = { version = "0.13.4", default-features = false, features = ["arithmetic", "ecdh", "ecdsa", "serde"] }
chacha20 = { version = "0.9.1", default-features = false }
sha256 = "1.6.0"
sha2 = "0.10.9"
hex = "0.4.3"
light-poseidon = "0.4.0"
ark-bn254 = "0.5.0"
ark-ff = "0.5.0"
rand = "0.9.2"
blake2 = { version = "0.10", default-features = false }
base64 = { version = "0.22", default-features = false }
#walrus-core = { git = "https://github.com/MystenLabs/walrus", default-features = false }
bytes = "1.0"
walrus_core = { path = "../walrus-core" }
cid = "0.11"
anyhow = "1.0"
