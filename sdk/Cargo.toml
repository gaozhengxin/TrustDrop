[package]
name = "maenad-sdk"
version = "0.1.0"
edition = "2024"

[dependencies]
k256 = "0.13.4"
rand = { version = "0.8", features = ["std", "getrandom"] }
blake3 = "1.8.2"
hex = "0.4.3"
serde = { version = "1.0.200", features = ["derive"] }
bincode = "1.3.3"
maenad-lib = { path = "../maenad-lib" }
storage = { path = "../storage" }
anyhow = "1.0.100"
ethers = { version = "2.0.14", features = ["rustls"] }
sha3 = "0.10"
tokio = { version = "1.0", features = ["full"] }
dotenv = "0.15.0"
