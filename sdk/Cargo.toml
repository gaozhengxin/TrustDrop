[package]
name = "maenad-sdk"
version = "0.1.0"
edition = "2024"

[dependencies]
k256 = { version = "0.13.4", features = ["ecdh", "ecdsa", "serde"] }
rand = { version = "0.8", features = ["std", "getrandom"] }
blake3 = "1.8.2"
hex = "0.4.3"
serde = { version = "1.0.200", features = ["derive"] }
bincode = "1.3.3"
drop-lib = { path = "../drop-lib" }
storage = { path = "../storage" }
anyhow = "1.0.100"
ethers = { version = "2.0.14", features = ["rustls"] }
sha2 = "0.10.9"
sha3 = "0.10"
chacha20 = "0.9.1"
sp1-sdk = "6.2.4"
tokio = { version = "1.0", features = ["full"] }
dotenv = "0.15.0"
