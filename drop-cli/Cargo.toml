[package]
name = "drop-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.100"
blake3 = "1.8.2"
drop-lib = { path = "../drop-lib" }
drop-sdk = { path = "../sdk" }
drop-script = { path = "../drop-script" }
ethers = { version = "2.0.14", features = ["rustls"] }
hex = "0.4"
k256 = { version = "0.13.4", features = ["ecdh", "ecdsa", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.117"
sha2 = "0.10"
sha3 = "0.10"
sp1-sdk = { version = "6.2.4", features = ["network"] }
storage = { path = "../storage" }
tokio = { version = "1.0", features = ["full"] }
