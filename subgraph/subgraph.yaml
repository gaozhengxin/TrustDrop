specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: ExchangeHub
    network: arbitrum-sepolia
    source:
      address: "0xAd7E0A828D5588e7e75b20244194c55d58c54A0b"
      abi: ExchangeHub
      startBlock: 276651753
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - ExchangeChannel
        - Sale
        - Purchase
        - Settlement
        - Refund
      abis:
        - name: ExchangeHub
          file: ./abis/ExchangeHub.json
      eventHandlers:
        - event: ExchangeChannelCreated(indexed address,indexed address)
          handler: handleExchangeChannelCreated
        - event: SaleListed(indexed address,indexed bytes32,bytes,uint256,bytes32,string)
          handler: handleSaleListed
        - event: SaleUpdated(indexed address,indexed bytes32,bytes,uint256,bytes32,string)
          handler: handleSaleUpdated
        - event: SaleDelisted(indexed address,indexed bytes32)
          handler: handleSaleDelisted
        - event: PurchaseEvent(indexed address,indexed bytes32,bytes,indexed address,uint256,(bytes32,uint256,uint256,uint256,bytes,bytes32))
          handler: handlePurchaseEvent
        - event: SettleEvent(indexed address,indexed address,indexed bytes32,bytes)
          handler: handleSettleEvent
        - event: RefundEvent(indexed address,indexed address,indexed bytes32,bytes,uint256)
          handler: handleRefundEvent
      file: ./src/exchange-hub.ts
templates:
  - kind: ethereum
    name: ExchangeChannelTemplate
    network: arbitrum-sepolia
    source:
      abi: ExchangeChannel
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Audience
        - DataKeyCommitment
        - DataKeyShare
        - VddProof
        - OracleRequestSkipped
      abis:
        - name: ExchangeChannel
          file: ./abis/ExchangeChannel.json
      eventHandlers:
        - event: Joined(indexed address,uint256)
          handler: handleJoined
        - event: DataKeyCommitmentUpdated(bytes32)
          handler: handleDataKeyCommitmentUpdated
        - event: DataKeyShared(address[],bytes32[])
          handler: handleDataKeyShared
        - event: VDDProofSubmitted(bytes)
          handler: handleVDDProofSubmitted
        - event: OracleRequestSkipped(bytes,string)
          handler: handleOracleRequestSkipped
      file: ./src/exchange-channel.ts
